global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'fastapi'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  - job_name: 'ml'
    static_configs:
      - targets: ['ml:8010']
    metrics_path: /metrics

# Alerting rules for anomaly detection
rule_files:
  - 'alert.rules.yml'
