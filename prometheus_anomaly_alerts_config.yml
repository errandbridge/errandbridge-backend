# Prometheus scrape config for anomaly alert metrics
# Add this job to your prometheus.yml

scrape_configs:
  - job_name: 'anomaly_alerts'
    static_configs:
      - targets: ['localhost:9101']  # Update host if running elsewhere
    metrics_path: '/'
    scheme: 'http'

# In Grafana, add a Prometheus data source and use the metric:
#   anomaly_alerts_total
# to create alert panels or dashboards.

# For production, ensure the port (9101) is accessible from your Prometheus server.
